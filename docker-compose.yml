services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: scraper-v2-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4001:4000"
      - "127.0.0.1:6090:6080"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "4000"
      HEADLESS: "true"
      BROWSER_CHANNEL: ""
      TZ: Asia/Bangkok
    volumes:
      - api-profiles:/app/apps/api/profiles
    networks:
      - scraper-v2
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: scraper-v2-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: "http://api:4000"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    networks:
      - scraper-v2
    depends_on:
      - api

volumes:
  api-profiles:

networks:
  scraper-v2:
    driver: bridge
